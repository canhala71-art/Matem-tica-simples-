name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Ícone da aplicação (a partir do icon.svg)
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../app/public/icon.svg -o assets/icon-only.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0b1220' --iconBackgroundColorDark '#0b1220'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MenteMat.apk
      - uses: actions/upload-artifact@v4
        with: { name: MenteMat-apk, path: android-app/MenteMat.apk }
      - name: Publicar numa Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest MenteMat.apk --title "MenteMat (APK Android)" --notes "APK de instalação direta. Abre a aplicação publicada em https://matem-tica-simples-q3v5.vercel.app, por isso recebe as atualizações do site sem reinstalar." --target "${{ github.sha }}"
